<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>退職ツール｜退職時の連絡方法と手続き</title>

  <meta name="description" content="退職時の連絡方法や手続きについて、対面が難しいケースも含めて分かりやすく解説します。トラブルを避けるためのポイントも紹介。" />

  <style>
    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* ヘッダー */
    .site-header {
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-weight: bold;
      text-decoration: none;
      color: #111827;
    }
    .nav a {
      margin-left: 16px;
      text-decoration: none;
      color: #1d4ed8;
      font-size: 14px;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 14px 40px;
      background: #fff;
    }

    h1 {
      font-size: clamp(24px, 5vw, 40px);
      line-height: 1.3;
      margin: 16px 0;
    }

    .lead {
      font-size: clamp(14px, 2.8vw, 18px);
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .manga-wrap {
      max-width: 960px;
      margin: 20px auto 24px;
    }

    .manga-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      border: 1px solid #ddd;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .link-block {
      margin: 20px 0;
    }

    .link-block a {
      display: block;
      margin: 8px 0;
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }

    .cta {
      display: block;
      margin: 24px auto 0;
      padding: 16px 20px;
      max-width: 420px;
      text-align: center;
      background: #ff6a00;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      font-size: 18px;
    }

    .cta:hover {
      opacity: 0.9;
    }

    @media (min-width: 768px) {
      .page {
        padding: 36px 32px 56px;
        margin-top: 24px;
        margin-bottom: 24px;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <body>
  <div id="site-header"></div>

  <script>
    fetch("header.html")
      .then((response) => response.text())
      .then((html) => {
        document.getElementById("site-header").innerHTML = html;

        const current = location.pathname.split("/").pop() || "index.html";
        document.querySelectorAll(".nav a").forEach((link) => {
          if (link.getAttribute("href") === current) {
            link.classList.add("current");
          }
        });
      });
  </script>

  <div class="page">

    <h1>退職の連絡方法ガイド</h1>

    <p class="lead">
      退職に関する連絡方法や手続きについて、状況に応じた現実的な対応をまとめています。
    </p>

    <div class="manga-wrap">
      <img
        src="./taishoku-manga.png"
        alt="退職の流れを説明する漫画"
      />
    </div>

    <div class="link-block">
      <a href="taishoku-denwa-muri.html">
        👉 電話で伝えるのがつらい
      </a>
      <a href="taishoku-yuso.html">
        👉 郵送で退職したい
      </a>
    </div>

    <a class="cta" href="https://www.taishoku-tool.com/">
      退職届を作成する（無料）
    </a>

  </div>
</body>
</html>
